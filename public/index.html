<style type="text/tailwindcss">
@custom-variant dark (&:where(.dark, .dark *));
@theme {
  --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", ui-sans-serif, system-ui, "Helvetica Neue", sans-serif;
  --color-accent: #0F766E;
  --color-accent-deep: #0B5A54;
  --animate-rise: rise .5s cubic-bezier(.2,.8,.2,1) both;
  --animate-pop: pop .5s cubic-bezier(.2,.8,.2,1) both;
  --animate-fade: fade .3s ease-out both;
  --animate-ring: ring 1.8s ease-out infinite;
  --animate-shake: shake .4s ease-out both;
  @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
  @keyframes pop { 0% { opacity: 0; transform: scale(.4) } 70% { transform: scale(1.1) } 100% { opacity: 1; transform: scale(1) } }
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes ring { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(2.4); opacity: 0 } }
  @keyframes shake { 0%, 100% { transform: none } 20%, 60% { transform: translateX(-6px) } 40%, 80% { transform: translateX(6px) } }
}
@layer components {
  /* Liquid Glass: frosted fill, specular rim, soft lift */
  .glass { position: relative; isolation: isolate; background: var(--glass-bg); -webkit-backdrop-filter: blur(22px) saturate(1.5) brightness(1.1); backdrop-filter: blur(22px) saturate(1.5) brightness(1.1); box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px var(--glass-line); }
  .glass::before { content: ''; position: absolute; inset: 0; z-index: 1; border-radius: inherit; padding: 1px; pointer-events: none; background: var(--glass-rim); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); mask-composite: exclude; }
  .glass::after { content: ''; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none; background: var(--glass-sheen); }
  .glass-strong { background: var(--glass-bg-strong); -webkit-backdrop-filter: blur(28px) saturate(1.6); backdrop-filter: blur(28px) saturate(1.6); }
  .lens { background: var(--lens-bg); box-shadow: var(--lens-shadow); }
  .tile::before { content: ''; position: absolute; left: 23px; top: 0; bottom: 0; width: 2px; background: var(--rail); }
  .tile:first-child::before { top: 30px; }
  .tile:last-child::before { bottom: calc(100% - 30px); }
  .tile:only-child::before { display: none; }
}
</style>
<style>

  html { -webkit-tap-highlight-color: transparent; }

<body class="h-full font-sans antialiased bg-[#ECEEF1] text-zinc-900 dark:bg-[#0B0B0D] dark:text-zinc-50 overscroll-none">

<div id="dash" class="min-h-full [background:var(--wash)]"></div>

<div id="trip" class="hidden fixed inset-0 lg:grid lg:grid-cols-[440px_minmax(0,1fr)]">
  <div id="sheet" class="fixed inset-x-0 bottom-0 z-20 flex h-[80dvh] flex-col gap-2.5 px-3 transition-[transform,padding-bottom] duration-500 ease-[cubic-bezier(.2,.8,.2,1)] lg:static lg:z-auto lg:h-full lg:px-5 lg:[background:var(--wash)] lg:border-r lg:border-black/5 lg:dark:border-white/10" style="padding-bottom:calc(var(--sab) + 88px)"></div>
  <div id="mapwrap" class="absolute inset-0 lg:relative lg:h-full">
    <div id="map" class="absolute inset-0 z-0"></div>
    <div id="hud" class="absolute inset-x-3 z-10 lg:inset-x-5" style="top:calc(var(--sat) + 12px)"></div>
    <div id="crosshair" class="hidden absolute left-1/2 top-1/2 z-10 -translate-x-1/2 -translate-y-full pointer-events-none text-accent drop-shadow-lg"></div>
    <div id="mapctl" class="absolute right-3 z-10 flex flex-col items-end gap-2.5 transition-[bottom,opacity] duration-500 ease-[cubic-bezier(.2,.8,.2,1)] lg:right-6"></div>
    <div id="attrib" class="absolute left-3 z-10 rounded-full bg-white/70 dark:bg-zinc-900/70 backdrop-blur-md px-2 py-0.5 text-[10px] text-zinc-600 dark:text-zinc-300 transition-[bottom,opacity] duration-500 ease-[cubic-bezier(.2,.8,.2,1)]"></div>
  </div>
  <nav id="tabbar" class="fixed inset-x-3 bottom-[var(--tb)] z-[45] lg:inset-x-auto lg:left-5 lg:bottom-5 lg:w-[400px]" style="--tb:calc(var(--sab) + 10px)"></nav>
</div>

<div id="modal"></div>
<div id="lightbox" class="hidden fixed inset-0 z-[55] select-none"></div>
<div id="gate" class="hidden fixed inset-0 z-50 grid place-items-center overflow-y-auto [background:var(--wash)] p-6"></div>
<div id="toast" class="pointer-events-none fixed inset-x-0 z-[60] flex justify-center" style="bottom:calc(var(--sab) + 90px)"></div>

<script>
// ---------- utilities ----------
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g, '').slice(0, 12) : Math.random().toString(36).slice(2, 14));
const FRAME = new URLSearchParams(location.search).has('frame');
document.documentElement.style.setProperty('--sat', FRAME ? '54px' : 'env(safe-area-inset-top, 0px)');
document.documentElement.style.setProperty('--sab', FRAME ? '22px' : 'env(safe-area-inset-bottom, 0px)');
const isDesktop = () => matchMedia('(min-width: 1024px)').matches;
document.addEventListener('animationend', ev => { const el = ev.target; if (!(el instanceof Element)) return; ['animate-rise', 'animate-fade', 'animate-pop', 'animate-shake'].forEach(c => el.classList.remove(c)); if (el.style.animationDelay) el.style.animationDelay = ''; });
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const fmtTime = t => { if (!t) return 'Anytime'; const [h, m] = t.split(':').map(Number); return `${((h + 11) % 12) + 1}:${String(m).padStart(2, '0')} ${h >= 12 ? 'PM' : 'AM'}`; };
const timeKey = e => e.time || '99:99';
const fmtDate = (iso, o) => new Date(iso + 'T12:00:00').toLocaleDateString('en-US', o);
const rangeLabel = (a, b) => { const A = new Date(a + 'T12:00'), B = new Date(b + 'T12:00'); const same = A.getMonth() === B.getMonth(); return `${A.toLocaleDateString('en-US', {month:'short', day:'numeric'})} – ${B.toLocaleDateString('en-US', same ? {day:'numeric'} : {month:'short', day:'numeric'})}, ${B.getFullYear()}`; };
const daysUntil = iso => Math.ceil((new Date(iso + 'T00:00') - new Date().setHours(0, 0, 0, 0)) / 864e5);
const datesBetween = (a, b) => { const out = []; const d = new Date(a + 'T12:00'); const end = new Date(b + 'T12:00'); while (d <= end) { out.push(d.toISOString().slice(0, 10)); d.setDate(d.getDate() + 1); } return out; };
const pinned = e => e && e.lat != null && e.lng != null;

const ICON = {

const ROLES = [['edit', 'Edit'], ['view', 'View'], ['none', 'Hidden']];
function roleOf(t, name) { if (t.access) return t.access[name] || null; if (t.travelers && t.travelers.length) return t.travelers.includes(name) ? 'edit' : 'view'; return 'edit'; }
const accessOf = t => Object.fromEntries(EVERYONE().map(n => [n, roleOf(t, n) || 'none']));
const peopleOf = t => EVERYONE().filter(n => roleOf(t, n)).map(memberOf);

const personRow = (m, i, right) => `<div class="flex items-center gap-3">${avatar(m, i, 'size-8 text-[11px]', 'ring-transparent')}<span class="min-w-0 flex-1 truncate text-sm font-medium">${esc(m.name)}${m.name === me() ? '<span class="ml-1.5 font-normal text-zinc-400">you</span>' : ''}</span>${right}</div>`;
const peopleRows = () => `<div class="flex flex-col gap-2">${MEMBERS.map((m, i) => personRow(m, i, roleSeg(m.name))).join('')}</div>`;
const dayCount = (a, b) => { const n = a && b && b >= a ? datesBetween(a, b).length : 0; return n ? `${n} ${n === 1 ? 'day' : 'days'}` : 'Pick both dates'; };
const coverBox = () => { const name = ($('[data-edittripform] input[name="name"]') || {}).value || T().name; return `<div data-coverbox class="relative">${cover({ id: '', name, cover: tripDraft.cover }, 'h-40 rounded-[22px]')}<div class="absolute inset-x-3 bottom-3 flex justify-end gap-2"><label class="inline-flex h-9 cursor-pointer items-center rounded-full bg-white/90 dark:bg-zinc-900/90 px-3.5 text-[13px] font-medium backdrop-blur shadow transition active:scale-95">${tripDraft.cover ? 'Change photo' : 'Add a photo'}<input type="file" accept="image/*" data-cover class="hidden"></label>${tripDraft.cover ? `<button type="button" data-act="removecover" class="h-9 rounded-full bg-white/90 dark:bg-zinc-900/90 px-3.5 text-[13px] font-medium text-red-600 dark:text-red-400 backdrop-blur shadow transition active:scale-95">Remove</button>` : ''}</div></div>`; };
function draftAccess() {
  const access = {}; EVERYONE().forEach(n => { const r = tripDraft.access[n]; if (r && r !== 'none') access[n] = r; });
  if (!Object.values(access).includes('edit')) { toast('Someone has to be able to edit'); return null; }
  const mine = access[me()];
  if (mine !== 'edit' && !confirm(mine === 'view' ? 'You\u2019ll be able to see this trip but not change it. Continue?' : 'This trip will be hidden from you. Continue?')) return null;
  return access;
}
function openEditTrip() {
  const t = T(); if (!t) return;

    <form data-edittripform class="flex flex-col gap-3">

    </form>`, { wide: true });
}
function openTripDetails(t) {
  const label = { edit: 'Can edit', view: 'View only' };
  openModal(`${modalHead('Trip details')}
    <div class="flex flex-col gap-4">
      ${cover(t, 'h-40 rounded-[22px]')}
      <div><h4 class="text-lg font-semibold tracking-tight">${esc(t.name)}</h4><p class="text-sm text-zinc-500 dark:text-zinc-400">${rangeLabel(t.start, t.end)} · ${dayCount(t.start, t.end)}</p></div>
      <div><div class="mb-1.5 text-[11px] font-medium uppercase tracking-wide text-zinc-400">People</div><div class="flex flex-col gap-2">${MEMBERS.filter(m => roleOf(t, m.name)).map((m, i) => personRow(m, i, `<span class="text-sm text-zinc-500 dark:text-zinc-400">${label[roleOf(t, m.name)]}</span>`)).join('')}</div></div>

async function setCover(file) {
  toast(MODE === 'cloud' ? 'Uploading photo…' : 'Adding photo…');
  try { tripDraft.cover = MODE === 'cloud' ? await uploadPhoto(file) : await toDataUrl(await shrink(file, 1200, .78)); }
  catch (e) { toast(navigator.onLine ? 'Upload failed — try again' : 'Photos need a connection'); return; }
  const box = $('[data-coverbox]'); if (box) box.outerHTML = coverBox();
}
function saveTrip(form) {
  const t = T(); if (!t || !canEdit()) { toast('This trip is view only for you'); return; }
  const f = Object.fromEntries(new FormData(form).entries());
  const name = f.name.trim(); if (!name) return;
  if (f.end < f.start) { toast('End date is before the start'); return; }
  const access = draftAccess(); if (!access) return;
  if (f.start !== t.start || f.end !== t.end) {
    const outside = t.entries.filter(e => e.date < f.start || e.date > f.end).length;
    if (outside && !confirm(`${outside} ${outside === 1 ? 'place falls' : 'places fall'} outside the new dates and will move to the nearest day. Continue?`)) return;
    applyDates(t, f.start, f.end);
  }
  Object.assign(t, { name, start: f.start, end: f.end, access, cover: tripDraft.cover || '' }); delete t.travelers;
  save(); closeModal();
  if (!roleOf(t, me())) { closeTrip(); toast('Trip updated · it\u2019s now hidden from you'); return; }
  if (!t.cities.find(c => c.id === ui.cityId)) ui.cityId = t.cities[0].id;
  if (!C().dates.includes(ui.date)) ui.date = firstDate();
  ui.selected = null; saveUi();
  renderHud(); renderSheet(false); renderControls(); updateMarkers(); fitTo(dayEntries());
  toast('Trip updated');
}
// re-flow the days: trim days outside the range, pull stray places to the nearest day, hand uncovered days to the city before them
function applyDates(t, start, end) {
  const all = datesBetween(start, end);
  t.entries.forEach(e => { if (e.date < start) e.date = start; else if (e.date > end) e.date = end; });
  t.cities.forEach(c => { c.dates = (c.dates || []).filter(d => d >= start && d <= end); });
  t.entries.forEach(e => { const c = t.cities.find(x => x.id === e.cityId); if (c && !c.dates.includes(e.date)) c.dates.push(e.date); });
  if (!t.cities.length) t.cities.push({ id: uid(), name: t.name, country: '', center: [20, 0], zoom: 2, dates: [] });
  const kept = t.cities.filter(c => c.dates.length);
  if (kept.length) t.cities = kept;
  else { const per = Math.max(1, Math.ceil(all.length / t.cities.length)); t.cities.forEach((c, i) => { c.dates = all.slice(i * per, (i + 1) * per); if (!c.dates.length) c.dates = [all[all.length - 1]]; }); }
  const owner = {}; t.cities.forEach(c => c.dates.forEach(d => { owner[d] = c; }));
  let last = t.cities.find(c => c.dates.length) || t.cities[0];
  all.forEach(d => { if (owner[d]) last = owner[d]; else last.dates.push(d); });
  t.cities.forEach(c => c.dates.sort());
}

// ---------- trip gallery & viewer: every photo on any place, in trip order ----------
const tripPhotos = (t = T()) => t ? t.entries.slice().sort((a, b) => (a.date + timeKey(a)).localeCompare(b.date + timeKey(b))).flatMap(e => (e.photos || []).map(url => ({ url, e }))) : [];

    ${groups.map(g => `<div class="mb-4"><div class="mb-2 text-[11px] font-medium uppercase tracking-wide text-zinc-400">${fmtDate(g.date, {weekday:'short', month:'short', day:'numeric'})} · ${esc(cityName(g.items[0].e.cityId))}</div><div class="grid grid-cols-3 gap-1.5">${g.items.map(x => `<button type="button" data-view-photo="${esc(x.url)}" class="relative aspect-square overflow-hidden rounded-2xl bg-black/[.05] dark:bg-white/[.08] transition active:scale-95"><img src="${esc(x.url)}" loading="lazy" alt="" class="absolute inset-0 size-full object-cover"><span class="absolute inset-x-0 bottom-0 truncate px-2 pb-1.5 pt-6 text-left text-[11px] font-medium text-white" style="background:linear-gradient(to top,rgba(0,0,0,.65),transparent)">${esc(x.e.name)}</span></button>`).join('')}</div></div>`).join('')}
    ${items.length ? '' : `<div class="grid place-items-center rounded-2xl bg-black/[.05] dark:bg-white/[.08] py-12 text-zinc-400">${ICON.photo.replace('size-5', 'size-8')}</div>`}</div>`;
}
function openGallery() { tab = 'photos'; renderTabbar(); openModal(galleryHtml(), { wide: true }); }
let lb = { items: [], i: 0 };
const lbOpen = () => !$('#lightbox').classList.contains('hidden');
const lbCap = x => { const c = T().cities.find(c => c.id === x.e.cityId); return `<div class="flex items-end justify-between gap-3"><div class="min-w-0"><div class="truncate font-semibold">${esc(x.e.name)}</div><div class="text-sm text-white/70">${fmtDate(x.e.date, {weekday:'short', month:'short', day:'numeric'})}${x.e.time ? ' · ' + fmtTime(x.e.time) : ''}${c ? ' · ' + esc(c.name) : ''}</div></div><div class="flex shrink-0 gap-2"><button data-act="lbgoto" class="h-9 rounded-full bg-white/15 px-3.5 text-[13px] font-medium backdrop-blur transition active:scale-95">Go to place</button>${canEdit() ? `<button data-act="lbdelete" class="h-9 rounded-full bg-white/15 px-3.5 text-[13px] font-medium text-red-300 backdrop-blur transition active:scale-95">Delete</button>` : ''}</div></div>`; };
function openLightbox(items, i) {
  lb = { items, i }; const box = $('#lightbox'); box.classList.remove('hidden');
  box.innerHTML = `<div class="absolute inset-0 bg-black animate-fade"></div>
    <div data-lbtrack class="absolute inset-0 flex snap-x snap-mandatory overflow-x-auto no-scrollbar">${items.map(x => `<div class="flex h-full w-full shrink-0 snap-center items-center justify-center" style="padding:calc(var(--sat) + 64px) 0 calc(var(--sab) + 96px)"><img src="${esc(x.url)}" alt="" class="max-h-full max-w-full object-contain"></div>`).join('')}</div>

function lbStep(d) { const track = $('[data-lbtrack]'); if (!track) return; const n = Math.max(0, Math.min(lb.items.length - 1, lb.i + d)); track.scrollTo({ left: n * track.clientWidth, behavior: 'smooth' }); }

// ---------- photos ----------
async function addPhotos(e, files) {
  const urls = [];
  if (MODE === 'cloud') {
    toast(files.length > 1 ? `Uploading ${files.length} photos…` : 'Uploading photo…');
    for (const f of files) { try { urls.push(await uploadPhoto(f)); } catch (err) { toast(navigator.onLine ? 'Upload failed — try again' : 'Photos need a connection'); break; } }
  } else files.forEach(f => urls.push(URL.createObjectURL(f)));
  if (!urls.length) return;
  e.photos = [...(e.photos || []), ...urls]; save(); renderSheet(false); if (!pinMode) renderControls();
  toast(`${urls.length === 1 ? 'Photo' : urls.length + ' photos'} added${MODE === 'cloud' ? ' · in the trip gallery too' : ' (kept for this session)'}`);
}
async function shrink(file, max = 1600, q = .82) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => createImageBitmap(file));
  const s = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
const toDataUrl = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
async function uploadPhoto(file) {
  const blob = await shrink(file);
  const r = await fetch(`${API}/photos`, { method: 'POST', headers: { 'content-type': 'image/jpeg', 'x-doctravels-key': auth.key }, body: blob });
  if (!r.ok) throw new Error('upload failed');
  const { key } = await r.json(); return `${API}/photos/${key}`;
}

// ---------- events ----------
document.addEventListener('click', ev => {
  const t = ev.target;
  const act = t.closest('[data-act]')?.dataset.act;
  const tb = t.closest('[data-tab]'); if (tb) { onTab(tb.dataset.tab); return; }
  const vp = t.closest('[data-view-photo]'); if (vp) { viewPhoto(vp.dataset.viewPhoto); return; }
  const open = t.closest('[data-open]'); if (open) { openTrip(open.dataset.open); return; }
  const city = t.closest('[data-city]'); if (city) { setCity(city.dataset.city); return; }
  const date = t.closest('[data-date]'); if (date) { setDate(date.dataset.date); return; }
  const rate = t.closest('[data-rate]'); if (rate) { if (!canEdit()) { toast('This trip is view only for you'); return; } const e = entryById(rate.closest('.tile').dataset.id); e.rating = Number(rate.dataset.rate) === e.rating ? 0 : Number(rate.dataset.rate); save(); renderSheet(false); return; }
  const method = t.closest('[data-method]'); if (method) { ({ search: openSearch, link: openLink, pin: startPinMode, here: useCurrentLocation })[method.dataset.method](); return; }
  const res = t.closest('[data-result]'); if (res) { const p = $('[data-results]')._items[Number(res.dataset.result)]; draft = { ...draft, name: p.name, address: p.address, lat: p.lat, lng: p.lng, cat: p.cat, website: p.website, yelp: p.yelp, cityId: p.cityId || ui.cityId, date: (p.cityId && p.cityId !== ui.cityId) ? T().cities.find(c => c.id === p.cityId).dates[0] : ui.date }; openForm(); return; }
  const role = t.closest('[data-role]'); if (role) { tripDraft.access[role.dataset.role] = role.dataset.value; role.parentElement.outerHTML = roleSeg(role.dataset.role); return; }
  const setting = t.closest('[data-setting]'); if (setting) { db.settings[setting.dataset.setting] = setting.dataset.value; saveUi(); applyAppearance(); if (map) setTiles(); openAccount(); return; }
  if (t.closest('[data-close]')) { closeModal(); return; }
  if (!act) return;
  if (ui.view === 'trip' && !canEdit() && ['add', 'edit', 'setpin', 'delete', 'movepin', 'pinconfirm'].includes(act)) { toast('This trip is view only for you'); return; }
  const tile = t.closest('.tile');
  switch (act) {
    case 'back': closeTrip(); break;
    case 'account': openAccount(); break;
    case 'trip': openEditTrip(); break;
    case 'removecover': { tripDraft.cover = ''; const b = $('[data-coverbox]'); if (b) b.outerHTML = coverBox(); break; }
    case 'newtrip': openNewTrip(); break;
    case 'add': openAddMethods(); break;
    case 'layers': db.settings.mapType = db.settings.mapType === 'satellite' ? 'standard' : 'satellite'; saveUi(); setTiles(); toast(db.settings.mapType === 'satellite' ? 'Satellite' : 'Standard map'); break;
    case 'locate': locateMe(); break;
    case 'gallery': openGallery(); break;
    case 'lbclose': closeLightbox(); break;
    case 'lbprev': lbStep(-1); break;
    case 'lbnext': lbStep(1); break;
    case 'lbgoto': { const x = lb.items[lb.i]; closeLightbox(); closeModal(); if (x && ui.selected !== x.e.id) selectEntry(x.e.id); break; }
    case 'lbdelete': { const x = lb.items[lb.i]; if (x && canEdit() && confirm('Delete this photo from the trip?')) deletePhoto(x); break; }
    case 'toggle': selectEntry(tile.dataset.id); break;
    case 'edit': { const e = entryById(tile.dataset.id); draft = { ...e, ...e.links }; openForm(e.id); break; }
    case 'setpin': { const e = entryById(tile.dataset.id); draft = { ...e, ...e.links }; pinReturn = { edit: e.id }; startPinMode(); break; }
    case 'delete': { const e = entryById(tile.dataset.id); if (confirm(`Remove “${e.name}” from the trip?`)) { T().entries = T().entries.filter(x => x.id !== e.id); ui.selected = null; save(); renderSheet(false); updateMarkers(); toast('Removed'); } break; }
    case 'movepin': { const form = $('[data-placeform]'); pinReturn = { edit: $('.modal-panel').dataset.edit || null }; draft = { ...draft, ...formDraft(form) }; startPinMode(); break; }
    case 'pincancel': { endPinMode(); if (pinReturn) { const r = pinReturn; pinReturn = null; openForm(r.edit); } break; }
    case 'pinconfirm': {
      const c = map.getCenter(); endPinMode();
      if (pinReturn) { const r = pinReturn; pinReturn = null; draft = { ...draft, lat: c.lat, lng: c.lng }; openForm(r.edit); }
      else { draft = { ...draft, name: '', lat: c.lat, lng: c.lng, address: '' }; openForm(); reverseGeocode(c.lat, c.lng).then(a => { const inp = $('[data-placeform] input[name="address"]'); if (inp && !inp.value) inp.value = a; }); }
      break;
    }
    case 'switch': closeModal(); openGate({ whoOnly: true }); break;
    case 'signout': if (confirm('Sign out of DocTravels on this device?')) signOut(); break;
    case 'reset': localStorage.removeItem(KEY); location.reload(); break;
  }
});
document.addEventListener('submit', ev => {
  const f = ev.target; ev.preventDefault();
  if (f.matches('[data-gate]')) submitGate(f);
  else if (f.matches('[data-note]')) { if (!canEdit()) { toast('This trip is view only for you'); return; } const text = f.text.value.trim(); if (!text) return; const e = entryById(f.closest('.tile').dataset.id); e.notes.push({ id: uid(), date: todayISO(), by: me(), text }); save(); renderSheet(false); toast('Note saved'); }
  else if (f.matches('[data-placeform]')) { if (!canEdit()) { toast('This trip is view only for you'); return; } savePlace(f, f.closest('.modal-panel').dataset.edit || null); }
  else if (f.matches('[data-tripform]')) createTrip(f);
  else if (f.matches('[data-edittripform]')) saveTrip(f);
  else if (f.matches('[data-linkform]')) { const p = parseLink(f.url.value); if (!p.website && !p.yelp) { toast('Paste a full link'); return; } draft = { ...draft, ...p, lat: null, lng: null }; openForm(); }
});
document.addEventListener('input', ev => {
  if (ev.target.matches('[data-search]')) { clearTimeout(searchTimer); const q = ev.target.value; searchTimer = setTimeout(() => runSearch(q), 300); }
  if (ev.target.matches('[data-edittripform] input[type="date"]')) { const f = ev.target.form, p = $('[data-days]'); if (p) p.textContent = dayCount(f.start.value, f.end.value); }
});
document.addEventListener('change', ev => {
  if (ev.target.matches('[data-photo]') && ev.target.files[0]) { if (!canEdit()) { toast('This trip is view only for you'); return; } const e = entryById(ev.target.closest('.tile').dataset.id); addPhotos(e, [...ev.target.files]); }
  if (ev.target.matches('[data-cover]') && ev.target.files[0]) setCover(ev.target.files[0]);
  if (ev.target.matches('[data-placeform] select[name="cityId"]')) { const city = T().cities.find(c => c.id === ev.target.value); const sel = ev.target.form.date; sel.innerHTML = city.dates.map(x => `<option value="${x}">${fmtDate(x, {weekday:'short', month:'short', day:'numeric'})}</option>`).join(''); }
});
document.addEventListener('keydown', ev => {
  if (lbOpen()) { if (ev.key === 'Escape') closeLightbox(); else if (ev.key === 'ArrowLeft') lbStep(-1); else if (ev.key === 'ArrowRight') lbStep(1); return; }
  if (ev.key === 'Escape') { if ($('.modal-panel')) closeModal(); else if (pinMode) { endPinMode(); pinReturn = null; } }
});
addEventListener('resize', () => { if (ui.view === 'trip') { layoutSheet(); map && map.invalidateSize(); } });
matchMedia('(min-width: 1024px)').addEventListener('change', () => { if (ui.view === 'trip') { layoutSheet(); renderSheet(false); map && setTimeout(() => map.invalidateSize(), 50); } });

// ---------- boot ----------
(async function boot() {
  applyAppearance();
  if (auth.key) { MODE = 'cloud'; renderDash(); restoreView(); afterLogin(); return; }
  MODE = await detectMode();
  if (MODE === 'local') { if (!db.trips.length) db.trips = structuredClone(SEED_TRIPS); db.trips.forEach(t => t.entries.forEach(e => { if (e.photos) e.photos = e.photos.filter(p => !p.startsWith('blob:')); })); renderDash(); restoreView(); setStatus('local'); return; }
  renderDash(); openGate();
})();
